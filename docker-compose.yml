services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goal_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goal_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goal_tracker_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goal_tracker_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/goal_portal?schema=public
      JWT_SECRET: replace-with-a-long-random-production-secret
      JWT_EXPIRES_IN: 8h
      JWT_COOKIE_NAME: goal_portal_token
      JWT_COOKIE_SAME_SITE: lax
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
      CLIENT_ORIGINS: http://localhost:5173
      NODE_ENV: production
      TRUST_PROXY_HOPS: 1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(async r => process.exit(r.ok && (await r.json()).database === 'available' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
